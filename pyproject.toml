[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrdayapy"
version = "0.1.3"
description = "Patient-specific cardiac electrophysiology pipeline: geometry/UVC coordinates, Purkinje network, monodomain simulation, forward ECG."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Vittal L. Rao", email = "vittal2026@gmail.com" },
    { name = "Ramarathnam Krishna Kumar" },
]
requires-python = ">=3.10"

# scikit-sparse and pypardiso are not yet used by the current package code;
# they live under the optional "sparse-solvers" extra below and will move
# into the core dependencies once those pipeline stages are migrated in.
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "pyvista",
    "vtk",
    "scikit-image",
    "pynrrd",
    "tqdm",
    "matplotlib",
]

[project.optional-dependencies]
sparse-solvers = [
    "pypardiso",
    "scikit-sparse",
]

[project.urls]
Homepage = "https://github.com/vittal2026/HrdayaPy"
Repository = "https://github.com/vittal2026/HrdayaPy"
Issues = "https://github.com/vittal2026/HrdayaPy/issues"

[tool.setuptools.packages.find]
include = ["hrdayapy*"]